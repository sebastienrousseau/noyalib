[package]
name = "noyalib-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# `fuzz_from_value` derives through serde_core, matching the crate
# itself since noyalib moved to it as a direct dependency (#227).
serde_core = { version = "1.0", features = ["std"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
# The archived upstream, used ONLY as the differential oracle for
# fuzz_serde_yaml_compat — the behavioural-shim parity fuzzer. Its
# advisory chain never touches the library: the fuzz crate is
# excluded from the workspace.
serde_yaml = "=0.9.34"
saphyr = "0.0.6"

[dependencies.noyalib]
path = "../crates/noyalib"
features = ["compat-serde-yaml"]

# ── Fuzz Targets ─────────────────────────────────────────────────────

[[bin]]
name = "fuzz_serde_yaml_compat"
path = "fuzz_targets/fuzz_serde_yaml_compat.rs"
test = false
doc = false

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_from_value"
path = "fuzz_targets/fuzz_from_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_multi_doc"
path = "fuzz_targets/fuzz_multi_doc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_strict"
