name: Security

on:
  # Feature branches run through the pull-request event; main runs after
  # merge. Keeping feature pushes out of this trigger avoids duplicate
  # CodeQL uploads for the same commit while preserving SAST coverage.
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]
  # Scan one specific commit. A commit that reached main through a
  # pull request against a release branch has no CodeQL check run of
  # its own, and OpenSSF Scorecard's SAST check counts it as unscanned
  # until it leaves the 30-commit window. Dispatching with its sha runs
  # the same analysis at that commit and attaches the check run there.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to analyse (default: the dispatched ref)'
        required: false
        type: string
      ref:
        description: >-
          Ref the results are uploaded against (default: the dispatched
          branch). GitHub creates the CodeQL check run on the commit only
          for a pull-request ref, e.g. refs/pull/395/head, which is what
          Scorecard's SAST check reads for a merged commit.
        required: false
        type: string
      run_ecosystem_fuzz:
        description: 'Run every pinned family fuzz target for one hour and retain actual receipts'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Test a SHA already merged into the default branch and record its result'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

# Least-privilege default: top-level workflow only reads. Jobs
# that need write scope (CodeQL → security-events) get it
# locally — see the per-job `permissions:` blocks below.
permissions:
  contents: read

jobs:
  # ── Dependency review (PRs only) ───────────────────────────────────
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0

  # ── CodeQL analysis ────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust,actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # On a dispatch with a sha, results (and the check run) attach
          # to that commit; the ref must contain it.
          ref: ${{ inputs.ref || (inputs.sha && github.ref) || '' }}
          sha: ${{ inputs.sha || '' }}

  # Dispatches can write caches in the default branch's scope even with a
  # read-only repository token. Only execute revisions already in the default
  # branch's trusted history; resolve the checkout from GitHub's ancestry data.
  resolve-history:
    name: Validate historical revision
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.history.outputs.sha }}
      default_branch: ${{ steps.history.outputs.default_branch }}
    steps:
      - name: Require a merged revision
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          python3 - <<'PY'
          # BEGIN HISTORICAL TARGET
          import json, os, re, subprocess
          from urllib.parse import quote

          requested = os.environ["TARGET_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", requested):
              raise SystemExit("Historical tests require a full commit SHA")
          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          branch = api(f"repos/{repo}")["default_branch"]
          default_branch = quote(branch, safe="")
          comparison = api(f"repos/{repo}/compare/{requested}...{default_branch}")
          resolved = comparison["merge_base_commit"]["sha"]
          if (comparison["status"] not in {"ahead", "identical"}
                  or comparison["base_commit"]["sha"] != requested
                  or resolved != requested):
              raise SystemExit("Historical tests only accept commits already merged into the default branch")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={resolved}\n")
              output.write(f"default_branch={branch}\n")
          # END HISTORICAL TARGET
          PY

  # Recover evidence for a historical fork PR whose workflow approval expired.
  # The tested source receives a read-only token and no restored cache. A
  # separate job records its actual test outcome against the confirmed SHA.
  historical-tests:
    name: Historical commit tests
    needs: resolve-history
    if: github.event_name == 'workflow_dispatch' && inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-historical-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Start from the trusted workflow revision and fetch its history.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select only a merged revision
        id: revision
        env:
          TARGET_SHA: ${{ needs.resolve-history.outputs.sha }}
          DEFAULT_BRANCH: ${{ needs.resolve-history.outputs.default_branch }}
        run: |
          python3 - <<'PY'
          # BEGIN HISTORICAL CHECKOUT
          import os, re, subprocess

          target = os.environ["TARGET_SHA"]
          branch = os.environ["DEFAULT_BRANCH"]
          if not re.fullmatch(r"[0-9a-f]{40}", target) or not branch:
              raise SystemExit("A pinned revision and its default branch are required")
          # Check ancestry locally as well, before switching to any old source.
          ancestor = subprocess.run([
              "git", "merge-base", "--is-ancestor", target, f"refs/remotes/origin/{branch}",
          ])
          if ancestor.returncode:
              raise SystemExit("The revision is not in the fetched default-branch history")
          subprocess.run(["git", "checkout", "--detach", target], check=True)
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != target:
              raise SystemExit("The checked-out source does not match the requested revision")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={actual}\n")
          # END HISTORICAL CHECKOUT
          PY
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Run the historical revision's tests
        run: cargo test --locked --all-features

  historical-test-status:
    name: Record historical test result
    needs: [resolve-history, historical-tests]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.run_tests
      && needs.resolve-history.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    # No checkout or source execution in the job holding the write token.
    steps:
      - name: Publish the actual test outcome
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_TESTS: ${{ inputs.run_tests }}
          TARGET_SHA: ${{ needs.resolve-history.outputs.sha }}
          TESTED_SHA: ${{ needs.historical-tests.outputs.sha }}
          TEST_RESULT: ${{ needs.historical-tests.result }}
        run: |
          python3 - <<'PY'
          # BEGIN HISTORICAL TEST STATUS
          import json, os, re, subprocess

          if os.environ["EVENT_NAME"] != "workflow_dispatch" or os.environ["RUN_TESTS"] != "true":
              raise SystemExit("Only an explicit historical test dispatch can report results")
          sha = os.environ["TARGET_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("A full tested commit SHA is required")
          result = os.environ["TEST_RESULT"]
          states = {"success": "success", "failure": "failure", "cancelled": "error", "skipped": "error"}
          if result not in states:
              raise SystemExit("Tests must have a terminal outcome before reporting")
          if result == "success" and os.environ["TESTED_SHA"] != sha:
              raise SystemExit("Successful tests must confirm the requested source SHA")
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) or not run_id.isdigit():
              raise SystemExit("Invalid workflow run identity")
          url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{run_id}"
          description = "All-feature tests passed at this commit" if result == "success" else "Historical tests did not pass"
          payload = {"state": states[result], "context": "ci/historical-tests", "target_url": url, "description": description}
          subprocess.run(
              ["gh", "api", "--method", "POST", f"repos/{repo}/statuses/{sha}", "--input", "-"],
              input=json.dumps(payload), text=True, check=True, stdout=subprocess.DEVNULL,
          )
          print(f"Recorded {states[result]} for the tested revision: {url}")
          # END HISTORICAL TEST STATUS
          PY

  ecosystem-fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ecosystem_fuzz
    uses: ./.github/workflows/ecosystem-fuzz.yml

  # ── Soak fuzz (weekly) ─────────────────────────────────────────────
  # Long-running fuzz campaigns that don't fit the per-push budget.
  # Each target gets a multi-hour slot per week; crashes / corpus
  # additions are uploaded as artefacts and survive the workflow run
  # for triage.
  soak-fuzz:
    name: Soak fuzz (${{ matrix.target }})
    # CACHE-POISONING GUARD: per-matrix-target CARGO_TARGET_DIR so
    # each fuzz target (`fuzz_parse`, `fuzz_roundtrip`, `fuzz_diff`,
    # `fuzz_strict`) has its own sanitiser-instrumented artefact
    # set. Sharing target/ across fuzz configurations is exactly
    # how a stale cache could hide a fuzz regression.
    # A dispatch that names a sha is a targeted CodeQL scan, not a soak.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.sha && !inputs.run_tests && !inputs.run_ecosystem_fuzz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse, fuzz_roundtrip, fuzz_diff, fuzz_strict]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-soak-fuzz-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target-soak-fuzz-${{ matrix.target }}"
          key: soak-fuzz-${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run ${{ matrix.target }} for 1 hour
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=3600
      - name: Upload corpus + crashes
        # A failed fuzz step still reaches this upload, while the job keeps
        # its failing conclusion so a discovered crash cannot look green.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          retention-days: 30

  # ── Soak Miri (weekly) ─────────────────────────────────────────────
  # Defence-in-depth: even with `#![forbid(unsafe_code)]`, transitive
  # deps (criterion, indexmap, etc.) contain `unsafe`. Miri exercises
  # the full test suite at the source-language level under sanitised
  # interpretation; the per-push CI runs a quick subset, this slot
  # runs the entire suite.
  soak-miri:
    name: Soak Miri (full suite)
    # CACHE-POISONING GUARD: isolated CARGO_TARGET_DIR — Miri's
    # interpreter fingerprint is distinct from every other job.
    # A dispatch that names a sha is a targeted CodeQL scan, not a soak.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.sha && !inputs.run_tests && !inputs.run_ecosystem_fuzz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 1440  # 24h ceiling
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-soak-miri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target-soak-miri"
          key: soak-miri
      - name: Setup Miri
        run: cargo +nightly miri setup
      - name: Run full suite under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-strict-provenance
        run: cargo +nightly miri test --all-features
