name: shared / no_std (alloc-only) build

# Reusable no_std invariant gate. Runs `cargo check
# --no-default-features --lib --locked` against the caller's
# crate, enforcing that `default-features = false` builds without
# `std` — which the README and CHANGELOG advertise.
#
# CACHE-POISONING GUARD: this workflow uses an isolated
# CARGO_TARGET_DIR so the no_std fingerprint can never be served
# from a previous `cargo check` that ran with `std` on (those
# would share the default `target/` under Swatinem/rust-cache and
# silently return a stale-but-passing result, masking real
# no_std regressions — exactly what hid the missing
# `crate::prelude::Vec` / `vec` import in doc_boundary.rs and the
# unused `crate::span_context` import in de.rs through v0.0.9
# and v0.0.10 of noyalib).
#
# Consumers pin by SHA:
#
#   jobs:
#     no-std:
#       uses: sebastienrousseau/noyalib/.github/workflows/shared-no-std.yml@<sha>

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: no_std (alloc-only) build
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-no-std
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Scope the cache to this workflow's isolated target dir
          # and split the cache namespace so it can't share state
          # with the `std`-on jobs. Belt-and-braces: even if
          # Swatinem changes default behaviour, the explicit
          # CARGO_TARGET_DIR above is the real guarantee.
          workspaces: ". -> target-no-std"
          key: no-std
      - name: cargo check --no-default-features (native target)
        run: cargo check --no-default-features --lib --locked
      # The behavioural serde_yaml shim advertises no_std+alloc
      # compatibility — hold it to that on every leg, not just the
      # bare default set.
      - name: cargo check --no-default-features --features compat-serde-yaml
        run: cargo check --no-default-features --features compat-serde-yaml --lib --locked

  # Bare-metal proof: `wasm32-unknown-unknown` has no `std`
  # libraries available, so any leaked `std::` symbol fails to
  # link. The native-target check above catches feature-flag
  # drift; this one catches a transitive dep silently enabling
  # `std` via feature unification.
  wasm-bare:
    name: no_std (wasm32-unknown-unknown bare-metal)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-no-std-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-no-std-wasm"
          key: no-std-wasm
      - name: cargo check --no-default-features --target wasm32-unknown-unknown
        run: cargo check --no-default-features --lib --locked --target wasm32-unknown-unknown
      - name: shim on wasm32 (no_std)
        run: cargo check --no-default-features --features compat-serde-yaml --lib --locked --target wasm32-unknown-unknown

  # Bare-metal `*-none` targets — the ones #210 was about. They have no
  # `std` at all, so a dependency pulling it in fails here instead of
  # being masked. wasm32 above passed *throughout* the #210 bug for
  # exactly that reason: the target has std available, so the three
  # dependencies that were pulling it in unconditionally went unnoticed.
  # That is why wasm32 alone is not sufficient cover.
  bare-metal:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
          - aarch64-unknown-none
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-no-std-bare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-no-std-bare"
          key: no-std-bare-${{ matrix.target }}
      - name: cargo check --no-default-features --target ${{ matrix.target }}
        run: cargo check --no-default-features --lib --locked --target ${{ matrix.target }}
      - name: shim on ${{ matrix.target }} (no_std)
        run: cargo check --no-default-features --features compat-serde-yaml --lib --locked --target ${{ matrix.target }}

