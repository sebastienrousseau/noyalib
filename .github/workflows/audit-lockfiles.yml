name: Audit all lockfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit all Cargo lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941
        with:
          tool: cargo-audit@0.22.2
      - name: Exercise audit scope regressions
        run: python3 scripts/tests/test_lockfile_audit.py
      - name: Audit production, fuzz and standalone test locks
        run: python3 scripts/audit-lockfiles.py --output-dir "$RUNNER_TEMP/dependency-audit"
      - name: Retain source and advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit
          if-no-files-found: error
