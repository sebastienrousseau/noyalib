name: Ecosystem scorecard

# Ecosystem scorecard — the CI-checked family table (REPO-STANDARD §8).
#
# `scripts/ecosystem-scorecard.sh` measures every repo in the lockstep
# family with falsifiable probes and exits non-zero when the weighted
# score drops below its floor (0.90 by default). Running it here turns
# the rating in docs/ECOSYSTEM.md into a gate: a satellite that drifts
# from the layout, loses a gate, or breaks the `=X.Y.Z` pin fails this
# workflow instead of silently going stale in the table.
#
# The harness builds and tests six repositories, so it runs weekly and
# on demand rather than per push, plus on any change to the harness
# itself or to the document it backs.

on:
  schedule:
    - cron: '0 8 * * 1' # Weekly Monday 08:00 UTC (after ci.yml, powerset, kani)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ecosystem-scorecard.sh
      - docs/ECOSYSTEM.md
      - .github/workflows/ecosystem-scorecard.yml
  pull_request:
    paths:
      - scripts/ecosystem-scorecard.sh
      - docs/ECOSYSTEM.md
      - .github/workflows/ecosystem-scorecard.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Family scorecard (floor 0.90)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The harness expects sibling checkouts under one root, the way
      # a maintainer's ~/Code/… tree is laid out. `ECOSYSTEM_ROOT` is
      # that root; the core is checked out into it by name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: noyalib

      # A release branch carries the next version before it publishes,
      # and the satellites carry the matching pin on a branch of the same
      # name (the lockstep contract). Measure that branch where it
      # exists so the version_lockstep probe compares like with like;
      # fall back to main.
      - name: Check out the satellites
        env:
          CORE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          for repo in noya-cli noyalib-lsp noyalib-mcp noyalib-wasm noyalib-serde-yaml; do
            url="https://github.com/sebastienrousseau/${repo}.git"
            ref=main
            if git ls-remote --exit-code --heads "$url" "$CORE_REF" >/dev/null 2>&1; then
              ref="$CORE_REF"
            fi
            echo "${repo}: ${ref}"
            git clone --depth 1 --branch "$ref" "$url" "${repo}"
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            noyalib
            noya-cli
            noyalib-lsp
            noyalib-mcp
            noyalib-wasm
            noyalib-serde-yaml
          key: ecosystem-scorecard

      # The supply-chain probes score N/A without these; installing them
      # keeps the measured fraction of the rubric honest.
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-deny,cargo-vet,cargo-audit
      - name: Install reuse
        run: pipx install reuse

      - name: Run the scorecard
        env:
          ECOSYSTEM_ROOT: ${{ github.workspace }}
        run: noyalib/scripts/ecosystem-scorecard.sh --json scorecard.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-scorecard
          path: scorecard.json
          if-no-files-found: warn
