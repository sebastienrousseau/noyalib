name: shared / Miri (focused, per-PR)

# Reusable per-PR Miri gate. Runs `scripts/miri.sh` (the caller's
# focused Miri subset) on ubuntu-latest, nightly Rust, with the
# Miri sysroot cached across runs so a fresh runner does not eat
# the ~12-minute sysroot build every time.
#
# CACHE-POISONING GUARD: Miri builds use `-Zmiri-*` flags plus the
# Miri sysroot — completely distinct fingerprint from every stable
# / nightly cargo build. Isolated CARGO_TARGET_DIR (target-miri)
# so a stale non-Miri artefact set cannot mask a Miri regression.
# The Miri sysroot lives at `~/.cache/miri` and `target-miri/miri`
# — cached across PRs via actions/cache keyed on the toolchain +
# Cargo.lock hash.
#
# The caller MUST ship a Miri driver at `scripts/miri.sh` (a small
# wrapper that invokes `cargo +nightly miri test` with any
# per-crate exclusions the caller wants).
#
# Consumers pin by SHA:
#
#   jobs:
#     miri-focused:
#       uses: sebastienrousseau/noyalib/.github/workflows/shared-miri-focused.yml@<sha>

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # One leg per PR: Stacked Borrows on the default build, ~55 minutes.
    # Tree Borrows and the symbolic alignment check are slower still and
    # run in the weekly sweep (shared-miri-full.yml). The alloc-only
    # build is not a leg: the library's unit tests are std-only (they
    # use vec!/format! without the alloc prelude), so `miri test --lib
    # --no-default-features` does not compile; that code shape is
    # covered by the fuzz-nostd crate instead.
    name: Miri (focused, per-PR, ${{ matrix.leg }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: stacked-borrows
            model: stacked
            features: ""
    # Wall-clock measurements (noyalib):
    #   Local M-series Mac (aarch64 NEON): ~32 min on a fresh sysroot.
    #   GitHub ubuntu-latest (x86_64, 2 vCPU): ~45+ min.
    #
    # Raised from 60 to 90 during v0.0.28. 60 was not headroom: #313
    # finished in ~50 min and #314 — which adds only version strings and
    # Markdown — was cancelled at exactly 60:00. A job whose typical run
    # is 45-50 min against a 60 min ceiling flakes on runner contention
    # alone, and a cancellation reports as a failed required check, which
    # is indistinguishable from real undefined behaviour until someone
    # opens the log.
    #
    # 90 still bounds a genuine hang well inside the 6h GitHub limit; the
    # scheduled `miri-full` continues to cover the deeper sweep plus
    # big-endian.
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-miri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: miri
      # Amortise the Miri sysroot build across PRs.
      - name: Cache Miri sysroot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/miri
            target-miri/miri
          key: miri-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            miri-${{ runner.os }}-
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-miri"
          key: miri-focused
          save-if: false
      - name: Run focused Miri suite
        env:
          MIRI_MODEL: ${{ matrix.model }}
          MIRI_FEATURES: ${{ matrix.features }}
        run: ./scripts/miri.sh
