name: shared / Miri (full + big-endian, scheduled)

# Reusable weekly Miri full-sweep. Runs `cargo miri test --lib`
# (with `-Zmiri-disable-isolation`) plus a big-endian cross-target
# run (`mips64-unknown-linux-gnuabi64`) via the caller's
# `scripts/miri.sh`. Catches endianness assumptions that would
# slip past the focused per-PR job.
#
# Bandwidth-intensive (~30+ minutes) so gated behind the
# `schedule` / `workflow_dispatch` event.
#
# CACHE-POISONING GUARD: same isolated CARGO_TARGET_DIR pattern
# as the focused Miri job (target-miri-full for this one).
#
# Consumers pin by SHA:
#
#   jobs:
#     miri-full:
#       uses: sebastienrousseau/noyalib/.github/workflows/shared-miri-full.yml@<sha>

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Miri (full + big-endian, scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-miri-full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          components: miri
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-miri-full"
          key: miri-full
          save-if: false
      - name: Setup Miri
        run: cargo +nightly miri setup
      - name: Run full Miri suite (native)
        run: cargo +nightly miri test --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
      # `cargo miri test --lib` still builds the crate's dev-dependencies,
      # and criterion pulls `alloca`, whose build script shells out to
      # cc-rs. Cross-compiling to mips64 therefore needs a mips64 C
      # toolchain on the runner even though Miri interprets the Rust and
      # never executes that C. Without it the step dies at
      # `ToolNotFound: mips64-linux-gnuabi64-gcc` before a single test
      # runs. `alloca` is not optional in criterion — it arrives via the
      # default `cargo_bench_support` feature — so this cannot be dropped
      # from the dependency side without breaking the benches.
      - name: Install mips64 cross toolchain (for the big-endian pass)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mips64-linux-gnuabi64
          mips64-linux-gnuabi64-gcc --version | head -1
      - name: Run focused Miri suite (big-endian mips64)
        run: ./scripts/miri.sh
        env:
          MIRI_TARGET: mips64-unknown-linux-gnuabi64
          # cc-rs looks up the target-specific compiler by this name.
          CC_mips64_unknown_linux_gnuabi64: mips64-linux-gnuabi64-gcc
