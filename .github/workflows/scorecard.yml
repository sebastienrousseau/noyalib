name: OpenSSF Scorecard

# Scores the repository against the public OpenSSF Scorecard rubric
# (signed releases, branch protection, dependency pinning, SAST,
# fuzzing, SLSA provenance, etc.). Results land in Rekor and the
# repo's public security tab; the badge in the README points at the
# live score.

on:
  branch_protection_rule:
  schedule:
    - cron: '0 4 * * 1'  # Weekly, Monday 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to Code Scanning
      id-token: write          # publish results to Rekor
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v3
        with:
          sarif_file: results.sarif
