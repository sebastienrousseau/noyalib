name: shared / zizmor (workflow security audit)

# Reusable GitHub Actions security audit (https://docs.zizmor.sh):
# template injection, excessive permissions, cache poisoning in
# release workflows, credential persistence, spoofable bot checks,
# dangerous triggers, impostor or known-vulnerable action pins. It
# complements shared-actionlint.yml, which checks that a workflow is
# well-formed; zizmor checks that it is safe.
#
# Gates at medium severity and above. A finding is fixed, or ignored
# in place with `# zizmor: ignore[<audit>]` and a written reason on the
# same line; there is no repository-wide allowlist.
#
# zizmor is installed from PyPI by exact version and wheel hash, so
# the auditor itself is pinned the way every action here is.
#
# Consumers pin by SHA:
#
#   jobs:
#     zizmor:
#       uses: sebastienrousseau/noyalib/.github/workflows/shared-zizmor.yml@<sha>

on:
  workflow_call:
    inputs:
      min-severity:
        description: Lowest severity that fails the job.
        required: false
        type: string
        default: medium

permissions:
  contents: read

jobs:
  check:
    name: workflow audit (zizmor)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor 1.30.1 (hash-pinned)
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/zizmor"
          cat > "${RUNNER_TEMP}/zizmor-requirements.txt" <<'REQ'
          zizmor==1.30.1 \
            --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e \
            --hash=sha256:4a5ef2fa4fbd2984f794cfc2f95790bd03fa0bae801487ed550e044675874e60 \
            --hash=sha256:92906f448365672ebb657fb50d36f997290a3aaba8cac723214741ea9054845d \
            --hash=sha256:15679642e8c4f825ba3f22537c698b1bbbad19ead23640f62ec45ebbe7abc803
          REQ
          "${RUNNER_TEMP}/zizmor/bin/pip" install --quiet --disable-pip-version-check \
            --only-binary=:all: --require-hashes \
            -r "${RUNNER_TEMP}/zizmor-requirements.txt"
          "${RUNNER_TEMP}/zizmor/bin/zizmor" --version

      # Online audits (impostor commits, known-vulnerable actions, pins
      # whose version comment names the wrong tag) read public GitHub
      # data with the job's read-only token.
      - name: Audit workflows, actions and dependabot.yml
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_SEVERITY: ${{ inputs.min-severity }}
        run: |
          "${RUNNER_TEMP}/zizmor/bin/zizmor" --format=github \
            --min-severity "$MIN_SEVERITY" .
