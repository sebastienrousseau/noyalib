name: shared / Markdown examples

# Reusable "compile every ```rust block in the caller's Markdown"
# gate. Runs `scripts/check-readme-examples.sh` which extracts every
# ` ```rust ` code block (excluding `,ignore`) from each file named
# by the `files` input, wraps each with `fn main()`
# if not already present (matches rustdoc's implicit-main
# behaviour), and compiles them against a scratch project.
#
# Cannot use `#[doc = include_str!("../README.md")]` because the
# workspace-root README lives outside published crates' package
# layouts — `cargo publish --dry-run` verification would fail. The
# script-based path preserves the "every README example is
# tested" invariant without breaking publish.
#
# CACHE-POISONING GUARD: isolated CARGO_TARGET_DIR. The scratch
# project this workflow spins up must never be served a cached
# artefact set from a different feature configuration.
#
# Consumers pin by SHA:
#
#   jobs:
#     readme-examples:
#       uses: sebastienrousseau/noyalib/.github/workflows/shared-readme-examples.yml@<sha>
#
# The caller MUST ship `scripts/check-readme-examples.sh` in its
# own repo (or arrange to fetch a copy). Satellite repos will
# typically vendor a matching copy of the script; the invariant
# it enforces is the same in every case.

on:
  workflow_call:
    inputs:
      files:
        description: >-
          Newline-separated Markdown files to check. Defaults to the
          workspace-root README alone, which is what satellite repos
          want; noyalib itself passes its `docs/` set too.
        required: false
        type: string
        default: "README.md"

permissions:
  contents: read

jobs:
  check:
    name: Markdown examples
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-readme-examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-readme-examples"
          key: readme-examples
      - name: Compile every rust block in each Markdown file
        # One scratch build per file. A file with no rust blocks is
        # reported as such rather than skipped silently, so a doc that
        # stops being checked because its blocks were renamed shows up.
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r f; do
            [ -n "${f}" ] || continue
            echo "── ${f} ──"
            README="${f}" bash scripts/check-readme-examples.sh || failed=1
          done <<< "${{ inputs.files }}"
          exit "${failed}"
