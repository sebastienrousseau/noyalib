name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the deploy job below needs the Pages
# and OIDC write scopes, so the build job (which compiles and runs
# third-party build scripts) never holds them.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    # CACHE-POISONING GUARD: strict RUSTDOCFLAGS below make this
    # build's fingerprint distinct from any warnings-tolerant docs
    # cache. Isolated CARGO_TARGET_DIR ensures a permissive
    # rustdoc artefact set can't be restored and short-circuit
    # the strict gate.
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-docs-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target-docs-pages"
          key: docs-pages

      - name: Build documentation (strict)
        # Strengthened RUSTDOCFLAGS catch broken intra-doc links,
        # private intra-doc links surfaced through re-exports, bad
        # codeblock fence attributes, malformed HTML, and bare
        # URLs that should be wrapped in `<https://...>` autolinks.
        # Phase 7.6 of docs/PLAN.md — every broken `[`Type`]` reference
        # in a doc comment now fails the docs build.
        env:
          RUSTDOCFLAGS: >-
            -D warnings
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::private_intra_doc_links
            -D rustdoc::invalid_codeblock_attributes
            -D rustdoc::invalid_html_tags
            -D rustdoc::bare_urls
        run: |
          cargo doc --no-deps --all-features

      - name: Build the User Manual (mdBook)
        run: |
          cargo install --locked mdbook --version 0.5.4
          mdbook build docs
          scripts/check-docs-links.sh

      - name: Assemble the Pages site
        # Site layout: /          - redirects to /noyalib/index.html
        #              /noyalib/  - rustdoc API reference
        #              /manual/   - the mdBook User Manual
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R target-docs-pages/doc/. site/
          cp -R target-book site/manual
          printf 'doc.noyalib.com\n' > site/CNAME
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>noyalib documentation</title>
            <meta http-equiv="refresh" content="0; url=noyalib/index.html">
            <link rel="canonical" href="noyalib/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="noyalib/index.html">the noyalib API reference</a> (<a href="manual/">User Manual</a>).</p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
