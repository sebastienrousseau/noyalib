name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  schedule:
    # Nightly at 04:00 UTC. Keeps the standard matrix + audit running
    # against `main` on days with no pushes, so external drift (a new
    # advisory, a toolchain bump) surfaces within a day.
    - cron: '0 4 * * *'
    # Mondays at 05:00 UTC — the full Miri sweep only (see `miri-full`
    # below). Split out of the nightly because that job alone costs
    # ~113 min: ~58 min native + ~56 min Miri-interpreted big-endian
    # mips64. Nightly was never a deliberate cadence for it — the job
    # had been failing in seconds since at least 2026-08-05, so the real
    # cost only appeared once it was fixed.
    #
    # An hour off the nightly on purpose. `concurrency` below is keyed
    # on workflow + ref with `cancel-in-progress: true`, so two crons
    # firing at the same instant would cancel one another.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@47ed7767be5273aef0bbc60c6f6c16aba5fb6f59 # v0.0.2
    with:
      rust-version: 'stable'
      run-clippy: true
      run-fmt: true
      run-audit: true
      # Coverage runs in the dedicated `coverage-gate` job below,
      # which uses `cargo +nightly llvm-cov` so the
      # `feature(coverage_attribute)` annotations work. The
      # reusable workflow's coverage step uses stable rustc and
      # fails on those annotations, so we keep it disabled here
      # to avoid duplicate work and red runs.
      run-coverage: false
    secrets: inherit

  test-matrix:
    # Dogfooded from shared-test-matrix.yml. Matrix (os × toolchain)
    # comes from the shared workflow's defaults. Satellites can
    # trim OSes / toolchains they don't support by passing custom
    # JSON to the `os-list` / `toolchain-list` inputs.
    # NOTE: MSRV-1.86 lives in msrv-core (below) — the opt-in
    # `compare-saphyr` bench feature pulls serde-saphyr, which
    # uses let-chains (1.88+), so `cargo test --all-features`
    # cannot run on the MSRV toolchain. The MSRV gate covers the
    # *core* feature set plus `validate-schema`.
    uses: ./.github/workflows/shared-test-matrix.yml

  miri-focused:
    # Dogfooded from shared-miri-focused.yml. noyalib is
    # `#![forbid(unsafe_code)]` so Miri does not police noyalib's
    # own code — it verifies the *interaction* with the unsafe
    # runtime deps (indexmap, rustc-hash, ryu, itoa, memchr,
    # smallvec) plus, via MIRI_TARGET, that the SWAR decimal
    # parser and structural-bitmask iterator work on big-endian
    # platforms. The shared workflow expects `scripts/miri.sh` to
    # exist in the caller's checkout.
    uses: ./.github/workflows/shared-miri-focused.yml

  miri-full:
    # Dogfooded from shared-miri-full.yml. Full sweep + big-endian
    # mips64 target.
    #
    # Restricted to the WEEKLY cron so the nightly run does not pay its
    # ~113 min. The shared workflow's own guard only distinguishes
    # schedule from push, which cannot tell the two crons apart — that
    # has to happen here, at the call site, because the shared file is
    # consumed by the satellites too and must not hardcode this repo's
    # cron.
    #
    # `github.event.schedule` carries the cron expression that fired, and
    # is absent on push / pull_request, so those skip the job as before.
    # workflow_dispatch still runs it on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 5 * * 1'
    uses: ./.github/workflows/shared-miri-full.yml

  cargo-deny:
    # Consumes the shared cargo-deny workflow from this same repo
    # so noyalib dogfoods the shared pattern before any satellite
    # takes it via `uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-deny.yml@<sha>`.
    uses: ./.github/workflows/shared-cargo-deny.yml

  actionlint:
    # Dogfooded from shared-actionlint.yml: lints every workflow file
    # (expression typos, shellcheck in run blocks) — the class of
    # mistake hand-edited workflows accumulate.
    uses: ./.github/workflows/shared-actionlint.yml

  gate-scripts-contract:
    # The gate scripts are load-bearing; a silent bug weakens every
    # release. scripts/tests/run.sh exercises each against known-good
    # and known-bad fixtures — the same contract-test shape as
    # build-script-contract, applied to the release gates.
    name: Gate-scripts contract
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/tests/run.sh

  size-gate:
    # Declared size budgets for shipped artefacts (scripts/
    # size-budgets.toml): the coverage-gate pattern applied to bytes.
    # Intentional growth raises the ceiling in the same commit.
    name: Size gate (declared budgets)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: shipped-size
      - run: ./scripts/size-monitor.sh

  docs-lint:
    # Dogfooded from shared-docs-lint.yml: markdownlint + codespell
    # over the caller's .markdownlint.yaml / .codespellrc. Part of
    # the Phase-1 layout normalization (docs/ECOSYSTEM.md).
    uses: ./.github/workflows/shared-docs-lint.yml

  fuzz-diff:
    # Dogfooded from shared-fuzz-diff.yml. Runs the caller's
    # `fuzz_diff` fuzz target for 10 seconds per push.
    uses: ./.github/workflows/shared-fuzz-diff.yml

  fuzz-regression:
    # Regression gate over the whole fuzz surface. Two guarantees the
    # 10s fuzz-diff smoke cannot give:
    #
    # 1. Every fuzz target BUILDS. Only fuzz_diff/fuzz_editors run per
    #    push otherwise, so the other ten can bit-rot silently until
    #    the weekly soak or an OSS-Fuzz build (the v0.0.29 cycle
    #    caught a corpus-packaging break only by manual verification).
    # 2. Every fixed fuzz finding STAYS fixed: fuzz/regressions/<t>/
    #    holds the minimized crash artifacts of previously-fixed bugs
    #    and each target replays them plus the seed corpus with
    #    -runs=0 (pure replay, deterministic, seconds per target).
    #
    # A crash here is always a real regression: known
    # differences-of-opinion never enter fuzz/regressions (they are
    # pinned as unit tests instead, e.g. anchor_name_may_contain_colon
    # in tests/competitor_bugs.rs).
    name: fuzz-regression
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-fuzz"
          key: fuzz-regression
      # Installed from source like shared-fuzz-diff.yml, deliberately
      # NOT via install-action: its prebuilt cargo-fuzz is a static
      # musl binary, and cargo-fuzz infers the fuzz target triple from
      # its own build triple, so the prebuilt one tries to build
      # sanitized fuzzers for x86_64-unknown-linux-musl and dies on
      # "sanitizer is incompatible with statically linked libc".
      - run: cargo install --locked cargo-fuzz
      - name: Build every fuzz target
        run: cargo +nightly fuzz build
      - name: Replay seed corpus and fixed-bug regressions
        run: |
          set -euo pipefail
          cd fuzz
          for f in fuzz_targets/*.rs; do
            t=$(basename "$f" .rs)
            dirs="corpus/seed"
            [ -d "regressions/$t" ] && dirs="$dirs regressions/$t"
            echo "── replaying $t against: $dirs"
            cargo +nightly fuzz run "$t" $dirs -- -runs=0
          done

  each-feature:
    # Single-feature build gate on every push and PR. The weekly
    # feature-powerset workflow covers the 309 pairwise combinations;
    # this catches the common case (one feature broken on its own,
    # usually a missing import or gate) before merge instead of at
    # the next weekly run.
    name: each-feature
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: each-feature
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-hack
      - name: cargo check each feature in isolation
        # --exclude-features mirrors feature-powerset.yml: nightly-simd
        # needs a nightly compiler and compare-saphyr is a dev-only
        # bench arm.
        run: |
          cargo hack check -p noyalib --each-feature \
            --exclude-features nightly-simd,compare-saphyr \
            --no-dev-deps

  cargo-semver-checks:
    name: cargo-semver-checks
    # On every PR, compare the public API of the proposed change
    # against the latest release tag and fail if any breaking
    # change is detected without a major-version bump. The crate
    # is at `0.0.x` so technically every minor change can break,
    # but running this gate now establishes the muscle for the
    # 1.x stability promise.
    #
    # Pre-publication guard: cargo-semver-checks needs a baseline
    # to compare against. Until `noyalib` ships its first crates.io
    # release the gate has nothing to compare and would always fail
    # with "noyalib not found in registry". The job is wired in
    # ready for v0.0.1's first publish; the published-package
    # probe below short-circuits to success in the meantime.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - id: published
        name: Probe crates.io for an existing release
        run: |
          if curl -sfL "https://crates.io/api/v1/crates/noyalib" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "noyalib not yet on crates.io — skipping semver-checks until first publish."
          fi
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        if: steps.published.outputs.exists == 'true'
        with:
          package: noyalib

  cargo-vet:
    # Dogfooded from shared-cargo-vet.yml — see the shared file
    # for full context. Satellites will consume it via
    # `uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-vet.yml@<sha>`.
    uses: ./.github/workflows/shared-cargo-vet.yml

  cargo-machete:
    # Dogfooded from shared-cargo-machete.yml — see the shared
    # file for full context. Satellites will consume it via
    # `uses: sebastienrousseau/noyalib/.github/workflows/shared-cargo-machete.yml@<sha>`.
    uses: ./.github/workflows/shared-cargo-machete.yml

  build-script-contract:
    name: build.rs contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build.rs must not touch the network or the filesystem
        run: |
          set -euo pipefail
          f=crates/noyalib/build.rs

          # A build script runs before any crate code, on every machine
          # that compiles this crate. Its documented contract (see the
          # module comment in that file) is: declare cfgs, read
          # `$RUSTC --version`, read one env var. Nothing else.
          #
          # Grepping for capability rather than reviewing by eye means a
          # future edit that reaches further has to defeat CI, not just
          # a reader's attention.
          if grep -nE '\b(TcpStream|UdpSocket|reqwest|ureq|curl|hyper)\b' "$f"; then
            echo "::error::build.rs must not access the network"
            exit 1
          fi
          if grep -nE 'fs::(write|create|remove|copy|rename|read_to_string|File)' "$f"; then
            echo "::error::build.rs must not touch the filesystem"
            exit 1
          fi

          # It legitimately spawns one subprocess: `$RUSTC --version`.
          # Anything else is out of contract.
          spawns=$(grep -cE 'Command::new' "$f" || true)
          if [ "${spawns}" -gt 1 ]; then
            echo "::error::build.rs spawns ${spawns} subprocesses; the contract allows one (\$RUSTC --version)"
            exit 1
          fi

          # No build-dependencies: adding one is a supply-chain change
          # that deserves its own review rather than arriving silently.
          if grep -qE '^\[build-dependencies\]' crates/noyalib/Cargo.toml; then
            echo "::error::build.rs must have no [build-dependencies]"
            exit 1
          fi

          echo "build.rs contract holds: no network, no filesystem, one subprocess, no build-deps"

  reuse-lint:
    # Dogfooded from shared-reuse.yml — see the shared file for
    # full context. Satellites will consume it via
    # `uses: sebastienrousseau/noyalib/.github/workflows/shared-reuse.yml@<sha>`.
    uses: ./.github/workflows/shared-reuse.yml

  msrv-core:
    # Dogfooded from shared-msrv-core.yml. Runs exactly three
    # sub-checks at the MSRV toolchain, each in its own isolated
    # CARGO_TARGET_DIR so a stale-but-passing cache from one
    # config cannot mask a regression in another:
    #
    #   1. cargo check --no-default-features --lib --locked
    #   2. cargo check --locked            (default features)
    #   3. cargo clippy --lib --locked -- -D warnings
    #
    # That is the whole gate. NO optional feature is enabled by
    # it — in particular `validate-schema` is NOT covered here,
    # despite compiling on the MSRV toolchain when checked by
    # hand. If you want an optional feature gated at the MSRV,
    # add a step to shared-msrv-core.yml; do not assume this job
    # already covers it.
    #
    # noyalib's MSRV is 1.86 for that core surface: default
    # features (`std`) plus the always-on parser / serializer /
    # Value / CST. 1.86 is the lowest toolchain the project can
    # be built AND tested on — `criterion 0.8` (dev-dependency)
    # requires 1.86, so `cargo check --all-targets`, the benches
    # and the coverage gate all fail on 1.85. The library alone
    # still compiles on 1.85, but nothing here could verify that
    # claim, so we do not publish it. The opt-in, bench-only
    # `compare-saphyr` feature needs a newer rustc (serde-saphyr
    # uses let-chains, 1.88+), so it and `--all-features` are out
    # of scope for the MSRV gate by construction.
    uses: ./.github/workflows/shared-msrv-core.yml
    with:
      toolchain: "1.86.0"

  coverage-gate:
    # Dogfooded from shared-coverage.yml. noyalib's thresholds
    # (95% fn / 94% line / 93% region) meet the 95% gold-standard
    # promise; the ignore-regex excludes the subprocess-driving
    # MCP/LSP tests and internal xtask tooling. (`noyalib-wasm`
    # coverage was excluded via the same regex until v0.0.12,
    # when the crate was split to its own repo per ADR-0005.)
    # Satellites can override any input to match their own coverage
    # baseline.
    #
    # The function threshold was 96 until v0.0.20. It was lowered to
    # 95 because 96 left under three functions of slack: the crate
    # measures 96.19% on main and 95.99% with #241 applied, and #241
    # neither adds a function nor removes a test — both revisions
    # define 289 source `fn`s and run the same 5092 `#[test]`s. Half
    # that delta is in value/mapping.rs, whose only change in #241 is
    # `MappingAny::with_capacity` -> `Self::with_capacity`, which is
    # semantically identical. A threshold that a no-op rename can
    # breach is measuring LLVM's instantiation accounting, not the
    # test suite. 95 keeps the gold-standard promise with enough
    # slack to survive that noise.
    uses: ./.github/workflows/shared-coverage.yml
    with:
      ignore-filename-regex: ''
      fail-under-functions: 95
      fail-under-lines: 94
      fail-under-regions: 93

  vendor-build:
    # Dogfooded from shared-vendor-offline.yml. Verifies the
    # workspace vendors + builds fully air-gapped — critical for
    # RHEL / FIPS-bound consumers.
    uses: ./.github/workflows/shared-vendor-offline.yml

  msrv-per-crate:
    # Dogfooded from shared-per-crate-msrv.yml. Walks every crate
    # in the workspace and runs `cargo +<msrv> check` against its
    # declared floor. Requires `scripts/msrv-per-crate.sh` in the
    # caller's checkout.
    uses: ./.github/workflows/shared-per-crate-msrv.yml

  no-std:
    # Dogfooded from shared-no-std.yml — the CARGO_TARGET_DIR
    # isolation + Swatinem cache-namespace split (preventing the
    # v0.0.9/v0.0.10 cache-poisoning class of bug) live in the
    # shared workflow. Satellites will consume it via
    # `uses: sebastienrousseau/noyalib/.github/workflows/shared-no-std.yml@<sha>`.
    uses: ./.github/workflows/shared-no-std.yml

  readme-examples:
    # Dogfooded from shared-readme-examples.yml. The check itself
    # (scripts/check-readme-examples.sh) is invoked by the shared
    # workflow and must exist in the caller's checkout at the same
    # path.
    uses: ./.github/workflows/shared-readme-examples.yml

  docs-strict:
    # Dogfooded from shared-rustdoc-strict.yml. The strict
    # RUSTDOCFLAGS + isolated CARGO_TARGET_DIR live in the shared
    # workflow.
    uses: ./.github/workflows/shared-rustdoc-strict.yml

  verify-signatures:
    # Dogfooded from shared-verify-signatures.yml. The gate itself
    # only runs on pull_request events (controlled inside the
    # shared workflow's `if:`).
    uses: ./.github/workflows/shared-verify-signatures.yml

  # ── Run every example to completion ─────────────────────────────
  # The main test job only *compiles* examples. A compiled example
  # can still panic at run time. scripts/run-all-examples.sh
  # auto-discovers every `[[example]]` target from `cargo metadata`
  # and runs each with its own `required-features`, so a runtime
  # regression (or a newly added example) is caught automatically.
  # Isolated CARGO_TARGET_DIR per the cache-poisoning doctrine.
  run-examples:
    name: Run all examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-run-examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-run-examples"
          key: run-examples
      - name: Run every example to completion
        run: bash scripts/run-all-examples.sh

  # ── Smoke-run every benchmark ───────────────────────────────────
  # `cargo build --benches` only compiles the benches; a bench can
  # compile yet panic on its first iteration (a stale fixture, a
  # renamed API, a tightened DoS budget). scripts/smoke-benches.sh
  # runs each bench once via Criterion's `--test` fast path — no
  # measurement, just execution — auto-discovered from cargo
  # metadata with their required-features.
  smoke-benches:
    name: Smoke-run all benches
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-smoke-benches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-smoke-benches"
          key: smoke-benches
      - name: Smoke-run every bench (Criterion --test)
        run: bash scripts/smoke-benches.sh

  # ── Feature-matrix guard: `lossless-u64` ────────────────────────
  # `lossless-u64` is an opt-in Cargo feature that adds a public
  # enum variant (`Number::Unsigned`). Ships with its own compile
  # + test legs using an isolated `CARGO_TARGET_DIR` so a stale
  # artefact set from the default-feature build cannot serve as a
  # passing fingerprint for the feature-on build. Same
  # cache-poisoning guard rule as `no-std` (v0.0.11 CI-integrity
  # cut). See docs/adr/0004-lossless-u64-integers.md.
  #
  # Runs 2 legs (a 3rd `minimal + lossless-u64` leg was considered
  # but drops `strict-deserialise` which several tests already
  # require; that intersection is covered by `no-std` for the
  # compile side).
  #
  #   1. defaults + lossless-u64 — typical opt-in user
  #   2. all-features — feature × every other feature (including
  #      `compat-serde-yaml`), catches interference
  #
  # Each leg exercises: `cargo check`, `cargo test --tests`,
  # `cargo test --doc`. The dedicated `examples/lossless_u64.rs`
  # runs on the defaults leg.
  lossless-u64-matrix:
    name: lossless-u64 (${{ matrix.leg }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: defaults
            flags: "--features lossless-u64"
          - leg: all-features
            flags: "--all-features"
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-lossless-u64-${{ matrix.leg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target-lossless-u64-${{ matrix.leg }}"
          key: lossless-u64-${{ matrix.leg }}
      - name: cargo check (${{ matrix.leg }})
        run: cargo check -p noyalib ${{ matrix.flags }} --locked
      - name: cargo test --tests (${{ matrix.leg }})
        run: cargo test -p noyalib ${{ matrix.flags }} --tests --locked
      - name: cargo test --doc (${{ matrix.leg }})
        run: cargo test -p noyalib ${{ matrix.flags }} --doc --locked
      - name: Run the lossless_u64 example
        if: matrix.leg == 'defaults'
        run: cargo run -p noyalib --example lossless_u64 --features lossless-u64 --locked
