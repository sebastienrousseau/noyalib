name: Registry drift net

# Weekly clean-room verification of the PUBLISHED artefacts, adapted
# from Takazudo/zudo-front-builder's drift-net: the release pipeline
# proves the registry path once, on release day — between releases,
# registry-side rot (a yanked dependency of a published version, an
# npm tarball that stopped propagating, an index regression) is
# invisible. This job installs everything a consumer would, from the
# registries only, with no repository checkout involved in the build.

on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates-io:
    name: clean-room installs (crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Library consumes from the registry
        run: |
          set -euo pipefail
          cargo new probe && cd probe
          cargo add noyalib
          printf 'fn main() { let v: noyalib::Value = noyalib::from_str("a: 1").unwrap(); println!("{v:?}"); }\n' > src/main.rs
          cargo run --release
      - name: Drop-in shim consumes from the registry
        run: |
          set -euo pipefail
          cargo new probe-shim && cd probe-shim
          cargo add serde_yaml --rename serde_yaml --package noyalib-serde-yaml 2>/dev/null || \
            printf '\n[dependencies]\nserde_yaml = { package = "noyalib-serde-yaml", version = "*" }\n' >> Cargo.toml
          printf 'fn main() { let v: serde_yaml::Value = serde_yaml::from_str("a: 1").unwrap(); println!("{v:?}"); }\n' > src/main.rs
          cargo run --release
      - name: CLI installs from the registry
        run: |
          set -euo pipefail
          cargo install noya-cli --locked
          noyafmt --version
          printf 'a: 1\n' | noyafmt --stdin
          noyavalidate --version

  npm:
    name: clean-room installs (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Both probes fetch the exact version this checkout declares straight
      # from the registry and verify the tarball against the sha512 the
      # registry publishes for it, then unpack it by hand. No `npm install`:
      # Scorecard flags one without a lockfile as unpinned, and a lockfile
      # here would have to be regenerated after every release (alerts #59
      # and #60). The probe also asks the question consumers ask: does the
      # package carry every file its entry module imports (the 0.0.35 npm
      # package did not).
      - name: Fetch a package by exact version, verified against the registry sha512
        run: |
          cat > fetch-pkg.sh <<'SH'
          #!/usr/bin/env bash
          # usage: fetch-pkg.sh <scoped name> <version> <dir>
          set -euo pipefail
          name=$1; version=$2; dir=$3
          meta=$(curl -sSf --retry 5 "https://registry.npmjs.org/${name//\//%2F}/${version}")
          tarball=$(printf '%s' "$meta" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(d.dist.tarball)')
          integrity=$(printf '%s' "$meta" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(d.dist.integrity)')
          curl -sSf --retry 5 -o pkg.tgz "$tarball"
          node -e '
            const fs=require("fs"),c=require("crypto");
            const [algo,want]=process.argv[2].split("-",2);
            const got=c.createHash(algo).update(fs.readFileSync("pkg.tgz")).digest("base64");
            if(got!==want){console.error(`integrity mismatch for ${process.argv[1]}: ${algo} ${got} != ${want}`);process.exit(1)}
            console.log(`${process.argv[1]} ${algo} integrity ok`)' "$name@$version" "$integrity"
          mkdir -p "$dir" && tar -xzf pkg.tgz -C "$dir" --strip-components=1
          rm -f pkg.tgz
          SH
          chmod +x fetch-pkg.sh
      - name: WASM package resolves and carries every file its entry imports
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version' crates/noyalib/Cargo.toml | cut -d'"' -f2)
          ./fetch-pkg.sh @sebastienrousseau/noyalib-wasm "$v" probe/node_modules/@sebastienrousseau/noyalib-wasm
          cd probe/node_modules/@sebastienrousseau/noyalib-wasm
          entry=$(node -e 'const p=require("./package.json");console.log(p.module||p.main)')
          for imp in $(grep -oE 'from "\./[^"]+"' "$entry" | sed -E 's/from "\.\/([^"]+)"/\1/' | sort -u); do
            [ -f "$imp" ] || { echo "$entry imports $imp, which the package does not carry"; exit 1; }
          done
          [ -f noyalib_wasm_bg.wasm ] && echo "wasm package $v: entry $entry and every import present"
      - name: MCP package resolves
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version' crates/noyalib/Cargo.toml | cut -d'"' -f2)
          ./fetch-pkg.sh @sebastienrousseau/noyalib-mcp "$v" probe-mcp/node_modules/@sebastienrousseau/noyalib-mcp
          cd probe-mcp && node -e "require.resolve('@sebastienrousseau/noyalib-mcp/package.json'); console.log('mcp package resolves')"
