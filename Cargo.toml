[workspace]
resolver = "3"
members = ["crates/noyalib"]
# The satellites now ship from their own repositories per ADR-0005
# workspace split:
#   - `noyalib-wasm`       → https://github.com/sebastienrousseau/noyalib-wasm       (since v0.0.12)
#   - `noyalib-mcp`        → https://github.com/sebastienrousseau/noyalib-mcp        (since v0.0.13)
#   - `noyalib-lsp`        → https://github.com/sebastienrousseau/noyalib-lsp        (since v0.0.13)
#   - `noya-cli`           → https://github.com/sebastienrousseau/noya-cli           (since v0.0.13)
#   - `noyalib-serde-yaml` → https://github.com/sebastienrousseau/noyalib-serde-yaml
#
# All five release in strict lockstep at the same `=0.0.X` version as
# this workspace. `noyalib-serde-yaml` was missing from this list while
# pinning `=0.0.X` exactly like the rest, so a release that consulted
# only this comment would have stranded it a version behind.
#
# Release order is not free: the pins are exact and ADR-0005 forbids a
# `path =` override, so a satellite cannot build against an unpublished
# version. This workspace publishes first, then the satellites bump to
# match. Bumping a satellite ahead of the publish leaves it referring to
# a version that does not exist yet.
#
# The `[workspace]` table is deliberate, not transitional. #134
# (which proposed collapsing this into a plain single-crate repo)
# is closed, and collapsing is no longer wanted: every satellite's
# CI sparse-checkouts `crates/noyalib/tests/yaml-test-suite` via
# shared-yaml-test-suite.yml, so moving the crate to the root
# breaks five repositories at once for a cosmetic gain.
#
# `xtask` was internal tooling and is gone; man pages and shell
# completions moved to `noya-cli` with the split. What still runs
# here does so from `Makefile` targets and `scripts/`.
exclude = ["demos/wasm", "fuzz", "fuzz-nostd"]

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = "unwind"
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
# Optimize for speed (3) over size ("s"). The parser is a hot
# library crate — `from_str::<Value>` on a 100 KB document is
# 30-50% faster under `opt-level = 3` than `"s"` because the
# scanner's tight per-byte dispatch and the loader's per-event
# match get fully inlined and vectorized. WASM bundle size is
# managed separately by `wasm-pack`'s post-build `wasm-opt -Os`
# pass in the noyalib-wasm satellite repo (ADR-0005).
opt-level = 3
# Keep overflow checks: the parser handles untrusted input and
# wraparound on indent/depth/size counters could turn DoS limit
# checks into bypassable computations. The cost is single-digit %
# on the hot scanner loop, well worth the security guarantee.
overflow-checks = true
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false
