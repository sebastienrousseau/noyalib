#
# `cargo audit` (and the `rustsec/audit-check` GitHub Action used by
# the reusable `Rust CI / Audit` job) read this file for advisory
# ignores. Mirrors the `[advisories].ignore` block in `deny.toml`,
# but applies to the standalone `cargo audit` tool which doesn't
# consume `deny.toml`.

[advisories]
# Empty on purpose, like `deny.toml`: an ignore that matches nothing in
# any lockfile is a check switched off without anyone noticing, and it
# would stay silent if the crate came back.
#
# Removed after v0.0.63 (#538), none of the crates being in any
# lockfile by then:
# - RUSTSEC-2025-0068 (serde_yml, unsound) and RUSTSEC-2025-0067
#   (libyml, unsound) came from the bench-only competitor crates,
#   which moved to the unpublished `noyalib-compare` crate and no
#   longer pull either.
# - RUSTSEC-2026-0173 (proc-macro-error2, unmaintained) came from
#   `validator_derive`; `validator` 0.21 uses proc-macro-error3.
ignore = []
