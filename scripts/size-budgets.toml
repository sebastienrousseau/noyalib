#
# Declared size budgets, enforced by scripts/size-monitor.sh (the
# shipped-sizes pattern from Takazudo/zudo-front-builder). A commit
# that intentionally grows an artifact raises its budget in the same
# commit, with the reason beside it — the same declared-budget
# contract as the CI duration monitor. Budgets are ceilings with
# deliberate headroom, not targets.

# The crates.io package. v0.0.59 measured 1,299,511 bytes before
# grow_value; its typed CST growth implementation and regression tests
# intentionally add source to the package. Allow 20,000 more bytes for
# that contribution, retaining the vendored YAML suite and all tests.
[crate-package]
max_bytes = 1320000
